<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>STRING · BioASQ Evidence Audit</title>
<style>
:root{font:14px Inter,ui-sans-serif,system-ui,sans-serif;color:#172033;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}header{padding:18px 24px;background:#fff;border-bottom:1px solid #dfe5ef}h1{margin:0 0 5px;font-size:20px}h2{font-size:14px;margin:0 0 10px}.subtle{color:#667085;font-size:12px}.error{margin:14px 24px;padding:14px;border:1px solid #e28b91;background:#fff1f2;color:#9f1239;border-radius:9px}main{max-width:1500px;margin:auto;padding:18px 24px}.summary{display:grid;grid-template-columns:repeat(8,minmax(100px,1fr));gap:8px;margin-bottom:14px}.card,.panel{background:#fff;border:1px solid #dfe5ef;border-radius:10px}.card{padding:10px 12px;min-height:72px;overflow:hidden}.card.wide{grid-column:span 2}.card b{display:-webkit-box;font-size:12px;line-height:1.35;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}.card small{display:block;color:#667085;font-size:10px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}.layout{display:grid;grid-template-columns:minmax(0,2.55fr) minmax(300px,1fr);gap:14px}.panel{padding:14px}.graph-wrap{height:700px;min-height:600px;overflow:hidden;position:relative;background:#fbfcfe;border-radius:8px;border:1px solid #e5eaf2}.graph-wrap svg{width:100%;height:100%;cursor:grab}.graph-wrap svg:active{cursor:grabbing}.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}button{border:1px solid #cbd4e2;border-radius:7px;padding:7px 9px;background:#fff;color:#263f73;cursor:pointer;font-size:12px}button.active{background:#263f73;color:#fff;border-color:#172747;box-shadow:0 2px 5px #17274744}.detail{min-height:700px;overflow:auto}.detail-grid{display:grid;grid-template-columns:110px 1fr;gap:8px;font-size:12px}.detail-grid dt{color:#667085;font-weight:650}.detail-grid dd{margin:0;overflow-wrap:anywhere}.full{white-space:pre-wrap;line-height:1.6;margin:5px 0 14px;padding:11px 12px;background:#f8fafc;border-left:3px solid #94a3b8;border-radius:6px}.badge{display:inline-block;padding:3px 6px;border-radius:999px;background:#eef2f7;font-size:10px;font-weight:800;white-space:normal}.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;color:#526071;font-size:12px}.legend span{display:flex;align-items:center;gap:4px}.dot{width:10px;height:10px;border-radius:3px;display:inline-block}.edge-key{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;color:#526071;font-size:12px}.edge-key i{font-style:normal}.node{stroke-width:2;filter:none}.node.selected rect{stroke:#0f172a;stroke-width:3;filter:drop-shadow(0 0 5px #2563eb88)}.node.dim{opacity:.3}.edge{fill:none;stroke-width:2}.edge.rejected{stroke-dasharray:5 4;opacity:.4}.edge.dim{opacity:.22}.edge.active{stroke-width:4;opacity:1}.edge-label{font-size:9px;fill:#526071;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.node-id{font-size:12px;font-weight:800;fill:#172033;text-anchor:middle}.node-preview{font-size:10px;fill:#526071;text-anchor:middle}.node-status{font-size:8px;font-weight:800;fill:#475569;text-anchor:middle;letter-spacing:.04em}.tooltip{position:absolute;pointer-events:none;display:none;max-width:260px;padding:7px 9px;background:#172033;color:#fff;border-radius:6px;font-size:11px;white-space:pre-line;z-index:2}.json{margin-top:14px}.json details{background:#fff;border:1px solid #dfe5ef;border-radius:9px;margin-top:8px}.json summary{padding:10px 12px;cursor:pointer;font-weight:750}.json pre{margin:0;padding:12px;max-height:400px;overflow:auto;background:#111827;color:#dbe7ff;font-size:11px;white-space:pre-wrap}@media(max-width:1050px){.summary{grid-template-columns:repeat(4,1fr)}.layout{grid-template-columns:1fr}.detail{min-height:0}.graph-wrap{height:600px}}@media(max-width:600px){main,header{padding:14px}.summary{grid-template-columns:repeat(2,1fr)}.card.wide{grid-column:span 2}}
</style></head><body><header><h1>BioASQ Evidence Audit</h1><div id="subtitle" class="subtle">Loading artifact and graph…</div></header><div id="error" class="error" hidden></div><main id="app" hidden><section id="summary" class="summary"></section><div class="layout"><section class="panel"><div class="toolbar"><button data-action="accepted">Accepted path</button><button data-action="rejected">Hide rejected</button><button data-action="assumptions">Assumptions</button><button data-action="reset">Reset view</button><button data-action="fit">Fit to screen</button></div><div id="graph" class="graph-wrap"><div id="tooltip" class="tooltip"></div></div><div class="legend"><span><i class="dot" style="background:#dbeafe"></i>Question</span><span><i class="dot" style="background:#e5e7eb"></i>Evidence</span><span><i class="dot" style="background:#ede9fe"></i>Atomic claim</span><span><i class="dot" style="background:#ccfbf1"></i>Refined claim</span><span><i class="dot" style="background:#ffedd5"></i>Assumption</span><span><i class="dot" style="background:#dcfce7"></i>Conclusion</span></div><div class="edge-key"><i>━━ supports</i><i>┄┄ grounded_in</i><i>╌╌ revised_to</i><i>··· depends_on</i></div></section><aside class="panel detail"><h2>Selected item</h2><div id="details" class="subtle">Select a node to inspect its full evidence and audit status.</div></aside></div><section class="json"><details><summary>Show artifact JSON</summary><pre id="artifact-json"></pre></details><details><summary>Show graph JSON</summary><pre id="graph-json"></pre></details></section></main>
<script>
document.querySelector('.edge-key').innerHTML='<strong style="width:100%;color:#526071;font-size:12px">Edge relations</strong><span><i style="display:inline-block;width:26px;border-top:3px solid #2563EB;margin-right:6px;vertical-align:middle"></i>Supports</span><span><i style="display:inline-block;width:26px;border-top:3px solid #16A34A;margin-right:6px;vertical-align:middle"></i>Grounded in</span><span><i style="display:inline-block;width:26px;border-top:3px solid #F59E0B;margin-right:6px;vertical-align:middle"></i>Revised to</span><span><i style="display:inline-block;width:26px;border-top:3px solid #9333EA;margin-right:6px;vertical-align:middle"></i>Depends on assumption</span>';
const $=id=>document.getElementById(id), esc=s=>{const d=document.createElement('div');d.textContent=s==null?'—':String(s);return d.innerHTML}, text=n=>n?.label??n?.text??'—';
let artifact,graph,nodes=[],edges=[],selected=null,state={accepted:false,rejected:false,assumptions:true,scale:1,ox:0,oy:0};
const colors={QUESTION:'#dbeafe',EVIDENCE_SNIPPET:'#e5e7eb',ANSWER_CLAIM:'#ede9fe',INTERMEDIATE_INFERENCE:'#ccfbf1',REFINED_CLAIM:'#ccfbf1',ASSUMPTION:'#ffedd5',CONCLUSION:'#dcfce7',EXPLANATION_STEP:'#f3f4f6'};
const typeName=t=>({QUESTION:'Question',EVIDENCE_SNIPPET:'Evidence',ANSWER_CLAIM:'Atomic claim',INTERMEDIATE_INFERENCE:'Refined claim',REFINED_CLAIM:'Refined claim',ASSUMPTION:'Assumption',CONCLUSION:'Conclusion',EXPLANATION_STEP:'Explanation step'}[t]||t||'Node');
function status(n){return n.acceptance_status||n.grounding_status||'UNSPECIFIED'} function short(s){s=String(s||'').replace(/\s+/g,' ').trim();const words=s.split(' ').slice(0,5).join(' ');return (words.length>34?words.slice(0,31)+'…':words)||'—'}
function normalize(){nodes=(graph.nodes||[]).map((n,i)=>({...n,_i:i}));const counts={};nodes.forEach(n=>{const k=n.type;counts[k]=(counts[k]||0)+1;n._label=k==='QUESTION'?'Q':k==='CONCLUSION'?'Conclusion':k==='EVIDENCE_SNIPPET'?'S'+counts[k]:k==='ANSWER_CLAIM'?'C'+counts[k]:k==='REFINED_CLAIM'?'RC'+counts[k]:k==='ASSUMPTION'?'A'+counts[k]:typeName(k)[0]+counts[k]});edges=(graph.edges||[]).map((e,i)=>({...e,_i:i}));}
function visible(n){return state.assumptions||n.type!=='ASSUMPTION' ? !(state.rejected&&status(n)==='REJECTED') : false} function edgeVisible(e){const a=nodes.find(n=>n.id===e.source),b=nodes.find(n=>n.id===e.target);return a&&b&&visible(a)&&visible(b)&&(!state.accepted||[a,b].some(n=>['ACCEPTED','ACCEPTED_WITH_ASSUMPTION','DIRECTLY_SUPPORTED','COMPOSITIONALLY_SUPPORTED','SOURCE','ACCEPTED'].includes(status(n))));}
function layout(){const lane={QUESTION:0,EVIDENCE_SNIPPET:1,ANSWER_CLAIM:2,INTERMEDIATE_INFERENCE:3,REFINED_CLAIM:3,CONCLUSION:4,ASSUMPTION:2,EXPLANATION_STEP:2};const by={};nodes.forEach(n=>(by[lane[n.type]??2]??=[]).push(n));Object.values(by).forEach(arr=>arr.forEach((n,i)=>{n.x=110+(lane[n.type]??2)*245;n.y=75+(i%4)*130+Math.floor(i/4)*105}));nodes.filter(n=>n.type==='ASSUMPTION'||n.type==='INTERMEDIATE_INFERENCE').forEach((n,i)=>{n.x=300+(i%4)*245;n.y=610+Math.floor(i/4)*105});}
function renderGraph(){const wrap=$('graph');wrap.querySelector('svg')?.remove();layout();const w=Math.max(1250,(Math.max(...nodes.map(n=>n.x),1000)+180)),h=Math.max(760,(Math.max(...nodes.map(n=>n.y),600)+100));const ns=nodes.filter(visible),es=edges.filter(edgeVisible);let sx='';const xy=n=>[n.x*state.scale+state.ox,n.y*state.scale+state.oy],ec={supports:'#2563EB',grounded_in:'#16A34A',revised_to:'#F59E0B',depends_on:'#9333EA'};const ep={supports:'SUPPORT',grounded_in:'GROUND',revised_to:'REVISED',depends_on:'ASSUME'};es.forEach(e=>{const a=nodes.find(n=>n.id===e.source),b=nodes.find(n=>n.id===e.target);if(!a||!b)return;const [x1,y1]=xy(a),[x2,y2]=xy(b);const bad=[a,b].some(n=>status(n)==='REJECTED'),active=selected&&(e.source===selected||e.target===selected),color=ec[e.type]||'#64748B',label=ep[e.type];sx+=`<path class="edge ${bad?'rejected':''} ${active?'active':''} ${selected&&!active?'dim':''}" d="M${x1+72},${y1} C${x1+125},${y1} ${x2-125},${y2} ${x2-72},${y2}" stroke="${color}" style="stroke-width:${e.type==='supports'?3.2:2.5}px"/>${label?`<g class="edge-pill" transform="translate(${(x1+x2)/2},${(y1+y2)/2-15})"><rect x="-30" y="-8" width="60" height="16" rx="8" fill="#fff" stroke="${color}"/><text x="0" y="3" text-anchor="middle" fill="${color}">${label}</text></g>`:''}`});ns.forEach(n=>{const [x,y]=xy(n), sel=selected===n.id?' selected':'', dim=selected&&selected!==n.id&&!edges.some(e=>(e.source===selected&&e.target===n.id)||(e.target===selected&&e.source===n.id))?' dim':'';sx+=`<g class="node${sel}${dim}" data-id="${esc(n.id)}" transform="translate(${x-72},${y-30})"><rect width="144" height="60" rx="10" fill="${colors[n.type]||'#fff'}" stroke="${status(n)==='REJECTED'?'#dc2626':'#94a3b8'}" class="node"/><text class="node-id" x="72" y="20">${esc(n._label)}</text><text class="node-preview" x="72" y="37">${esc(short(text(n)))}</text><text class="node-status" x="72" y="53">${esc(status(n))}</text></g>`});const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.innerHTML=`<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#64748b"/></marker></defs><g>${sx}</g>`;wrap.append(svg,$('tooltip'));svg.addEventListener('click',e=>{const g=e.target.closest('.node');if(g){selected=g.dataset.id;showDetails();renderGraph()}});svg.addEventListener('mousemove',e=>{const g=e.target.closest('.node');if(!g){$('tooltip').style.display='none';return}const n=nodes.find(x=>x.id===g.dataset.id);$('tooltip').textContent=`${n._label} · ${typeName(n.type)}\n${short(text(n))}`;$('tooltip').style.display='block';$('tooltip').style.left=(e.offsetX+12)+'px';$('tooltip').style.top=(e.offsetY+12)+'px'});}
function showDetails(){const n=nodes.find(x=>x.id===selected);if(!n){$('details').innerHTML='<span class="subtle">Select a node to inspect it.</span>';return}const ev=n.evidence_ids||n.source_ids||edges.filter(e=>e.target===n.id&&['grounded_in','supports','partially_supports'].includes(e.type)).map(e=>e.source);const rel=edges.filter(e=>e.source===n.id||e.target===n.id).map(e=>e.source===n.id?e.target:e.source);$('details').innerHTML=`<dl class="detail-grid"><dt>ID</dt><dd>${esc(n.id)}</dd><dt>Label</dt><dd>${esc(n._label)}</dd><dt>Type</dt><dd>${esc(typeName(n.type))}</dd><dt>Status</dt><dd><span class="badge">${esc(status(n))}</span></dd><dt>Grounding</dt><dd>${esc(n.grounding_status)}</dd><dt>Full text</dt><dd class="full">${esc(text(n))}</dd><dt>Evidence IDs</dt><dd>${esc(ev.join(', ')||'—')}</dd><dt>Previous claim</dt><dd>${esc(n.previous_claim_id||'—')}</dd><dt>Related assumptions</dt><dd>${esc(rel.filter(id=>nodes.find(x=>x.id===id)?.type==='ASSUMPTION').join(', ')||'—')}</dd></dl>`}
function summary(){const cs=artifact.conclusion_status||{};const claims=(artifact.grounding||[]);const assumptions=nodes.filter(n=>n.type==='ASSUMPTION').length;$('summary').innerHTML=[['Question',artifact.input?.body,'wide'],['Generated answer',artifact.generated?.concise_answer,'wide'],['Final answer',artifact.final_accepted_answer,'wide'],['Conclusion',cs.acceptance_status||'—'],['API calls',artifact.api_calls],['Runtime',artifact.runtime_seconds==null?'—':Number(artifact.runtime_seconds).toFixed(2)+'s'],['Accepted claims',claims.filter(c=>c.acceptance_status==='ACCEPTED').length],['Assumptions',assumptions]].map(x=>`<div class="card ${x[2]||''}"><small>${x[0]}</small><b>${esc(x[1])}</b></div>`).join('');}
function showError(e){$('error').hidden=false;$('error').textContent='BioASQ renderer error: '+e.message;$('app').hidden=true}function bind(){document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{const a=b.dataset.action;if(a==='reset'){state={accepted:false,rejected:false,assumptions:true,scale:1,ox:0,oy:0}}else if(a==='fit'){state.scale=Math.max(.72,Math.min(1,Math.min((innerWidth*.72)/1250,(innerHeight*.7)/760)));state.ox=0;state.oy=0}else state[a]=!state[a];b.classList.toggle('active',!!state[a]);b.setAttribute('aria-pressed',String(!!state[a]));renderGraph()});const wrap=$('graph');let drag=null;wrap.addEventListener('wheel',e=>{e.preventDefault();state.scale=Math.max(.72,Math.min(2.5,state.scale*(e.deltaY<0?1.1:.9)));renderGraph()},{passive:false});wrap.addEventListener('mousedown',e=>{if(e.target.closest('.node'))return;drag={x:e.clientX,y:e.clientY,ox:state.ox,oy:state.oy}});window.addEventListener('mouseup',()=>drag=null);window.addEventListener('mousemove',e=>{if(!drag)return;state.ox=drag.ox+e.clientX-drag.x;state.oy=drag.oy+e.clientY-drag.y;renderGraph()})}
Promise.all(['artifact.json','graph.json'].map(p=>fetch(p).then(r=>{if(!r.ok)throw Error(`${p} request failed (${r.status})`);return r.json()}))).then(([a,g])=>{artifact=a;graph=g;normalize();summary();renderGraph();showDetails();bind();$('artifact-json').textContent=JSON.stringify(a,null,2);$('graph-json').textContent=JSON.stringify(g,null,2);$('subtitle').textContent=`Run ${a.run_id||'—'} · Evidence-grounded answer audit`;$('app').hidden=false}).catch(showError);
</script></body></html>
